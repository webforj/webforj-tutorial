name: End-to-End Tests

on:
  pull_request:
  schedule:
    # 07:00 UTC = 08:00 CET (Europe/Berlin winter time). GitHub cron is UTC only,
    # so this fires at 09:00 local during CEST (summer time).
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      step:
        description: 'Tutorial step to test'
        type: choice
        default: all
        options:
          - all
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright suite (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify all tutorial steps
        if: github.event_name != 'workflow_dispatch' || inputs.step == 'all'
        run: mvn -B -ntp -fae verify

      - name: Verify selected tutorial step
        if: github.event_name == 'workflow_dispatch' && inputs.step != 'all'
        run: mvn -B -ntp -pl :customer-app-step-${{ inputs.step }} verify

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            */target/surefire-reports
            */target/failsafe-reports
            */target/visual-diffs
            */target/playwright-traces
          if-no-files-found: ignore
          retention-days: 14
