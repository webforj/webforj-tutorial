name: End-to-End Tests

on:
  schedule:
    # 07:00 UTC = 08:00 CET (Europe/Berlin winter time). GitHub cron is UTC only,
    # so this fires at 09:00 local during CEST (summer time).
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      it_test:
        description: 'Test filter passed to -Dit.test (e.g. Step3IT)'
        required: false
        default: '*IT'

jobs:
  e2e:
    name: Playwright suite (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run end-to-end test suite
        run: mvn -ntp -B verify -Dit.test='${{ inputs.it_test || '*IT' }}'

      - name: Upload failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            target/visual-diffs
            target/playwright-traces
            target/e2e-artifacts
          if-no-files-found: ignore
          retention-days: 14
